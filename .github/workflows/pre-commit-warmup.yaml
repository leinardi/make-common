name: Pre-commit Cache Warm-up

# Keeps a main-branch cache of the pre-commit hook environments for pull requests to restore: the
# pre-commit-all job in ci.yaml and the reviewdog annotation jobs read it under the same key
# (pre-commit|<OS>|<resolved Python version>|<hash of .pre-commit-config.yaml>). The weekly schedule is eviction insurance:
# GitHub evicts a cache nobody has read for seven days.
on:
  push:
    branches:
      - main
    paths:
      - .pre-commit-config.yaml
      - .github/workflows/pre-commit-warmup.yaml
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

concurrency:
  group: pre-commit-warmup-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # The reusable workflow's prune job keeps only the newest two pre-commit caches of this ref, so
  # the repository cache quota is not spent on hook environments nothing uses any more. Deleting a
  # cache needs actions: write, which only the calling job can grant: without it the prune job
  # warns and skips.
  warm-pre-commit-cache:
    permissions:
      contents: read
      actions: write
    uses: leinardi/gh-reusable-workflows/.github/workflows/pre-commit-warmup.yaml@2d081e865362f09c19a32f5ec86bc8a122d7c4aa # v1.5.1
